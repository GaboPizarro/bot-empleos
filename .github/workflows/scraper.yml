name: Job Scraper and Notifier

on:
  schedule:
    # Executes daily at 09:00 and 15:00 CLT (Chile Standard Time, UTC-4)
    # 09:00 CLT -> 13:00 UTC
    # 15:00 CLT -> 19:00 UTC
    # Note: During Chilean Summer Time (CLST, UTC-3), these will execute at 10:00 and 16:00 local time.
    # Adjust to "0 12,18 * * *" for Summer Time if needed.
    - cron: '0 13,19 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # caches pip dependencies for faster runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google Sheets Credentials File
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          # Write credentials JSON dynamically to prevent committing it
          echo "$GOOGLE_CREDS_JSON" > proyectoBot/credenciales.json

      - name: Run Job Scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          # The script will load sheet URLs, credentials files, and email passwords from env or fallback defaults
        run: |
          python proyectoBot/scrapper.py run-scraper
